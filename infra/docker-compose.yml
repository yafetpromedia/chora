version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: edu-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_os
      POSTGRES_USER: edu_os_user
      POSTGRES_PASSWORD: edu_os_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edu-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
